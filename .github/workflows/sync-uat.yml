name: Sync UAT

# Push a working branch, and UAT follows it. No PR, no merge, no ceremony —
# `uat.theaura.life` always shows the last thing pushed.
#
# `main` is deliberately absent from the trigger list: production is only
# ever reached by an approved PR from `uat`.

on:
  push:
    branches:
      - 'claude/**'
      - 'feature/**'
      - 'fix/**'
      - 'dev'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to put on UAT'
        required: true
        default: 'dev'

# UAT is a single shared slot. Queue pushes rather than racing them, and
# never cancel one mid-flight or the branch can be left pointing at a
# half-written ref.
concurrency:
  group: sync-uat
  cancel-in-progress: false

jobs:
  sync:
    name: Point uat at this commit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Resolve the commit
        id: resolve
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Refuse to sync main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::main is production. It does not sync to UAT."
          exit 1

      # Force, because UAT is a mirror of whatever is being worked on —
      # not a branch with its own history to preserve.
      - name: Update uat
        run: git push --force origin ${{ steps.resolve.outputs.sha }}:refs/heads/uat

      - name: Summary
        run: |
          {
            echo "### UAT updated"
            echo ""
            echo "**Commit** \`${{ steps.resolve.outputs.sha }}\`"
            echo ""
            echo "**Message** ${{ steps.resolve.outputs.subject }}"
            echo ""
            echo "**Source** \`${{ github.event.inputs.ref || github.ref_name }}\`"
            echo ""
            echo "Vercel is building now — https://uat.theaura.life"
          } >> "$GITHUB_STEP_SUMMARY"
